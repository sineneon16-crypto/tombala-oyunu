<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4 Kişilik Canlı Pişti - Online Oyun Salonu</title>
    <script src="/socket.io/socket.io.js"></script>
    <script async src="https://googlesyndication.com" crossorigin="anonymous"></script>
          <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(251, 191, 36, 0.35);
            flex-shrink: 0;
        }
        .back-btn {
            background: #1e293b;
            color: #e2e8f0;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #334155;
        }
        .scoreboard { display: flex; gap: 8px; font-size: 12px; font-weight: 600; }
        .score-box {
            background: #1e293b;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            white-space: nowrap;
        }
        .score-box span { color: #fbbf24; font-size: 14px; font-weight: 800; }

        /* Dış Kenarlı ve Ferah Masa Düzeni */
        .table-grid {
            flex: 1;
            display: grid;
            grid-template-rows: 36px 1fr auto;
            grid-template-columns: 115px 1fr 115px;
            width: 96%;
            max-width: 880px;
            max-height: 580px;
            margin: auto;
            padding: 8px;
            align-items: center;
            position: relative;
        }

        /* Yeşil Çuha Masa Çerçevesi (Sadece Orta ve Kart Alanını Sarar) */
        .table-grid::before {
            content: "";
            grid-column: 2;
            grid-row: 2 / 4;
            width: 100%;
            height: calc(100% - 34px);
            align-self: start;
            background: radial-gradient(circle at center, #059669 0%, #065f46 55%, #022c22 100%);
            border-radius: 28px;
            border: 8px solid #3f2305;
            box-shadow: 0 15px 40px rgba(0,0,0,0.85), inset 0 0 35px rgba(0,0,0,0.55);
            z-index: 0;
        }

        .seat-top { grid-column: 2; grid-row: 1; display: flex; justify-content: center; align-items: center; z-index: 2; }
        .seat-left { grid-column: 1; grid-row: 2; display: flex; justify-content: flex-end; align-items: center; padding-right: 10px; z-index: 2; }
        .seat-right { grid-column: 3; grid-row: 2; display: flex; justify-content: flex-start; align-items: center; padding-left: 10px; z-index: 2; }
        .seat-bottom { grid-column: 2; grid-row: 3; display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; padding-bottom: 4px; z-index: 2; }
        .center-table { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-top: 14px; z-index: 2; }

        .hand, .side-hand { display: none; }
        .player-hand { display: flex !important; justify-content: center; gap: 10px; min-height: 104px; align-items: center; }

        .player-tag {
            background: #1e293b;
            color: #e2e8f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid #475569;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .player-tag.active-turn {
            background: #fbbf24;
            color: #0f172a;
            border-color: #fef08a;
            font-weight: 800;
            box-shadow: 0 0 14px rgba(251, 191, 36, 0.85);
        }

        .card {
            width: 74px;
            height: 104px;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            border-radius: 9px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #cbd5e1;
        }
        .player-hand .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 12px 20px rgba(251, 191, 36, 0.75);
            border-color: #fbbf24;
        }
        .card.red { color: #dc2626; }
        .card.black { color: #0f172a; }
        .card-center { font-size: 28px; text-align: center; }

        .card-back {
            width: 74px;
            height: 104px;
            background: repeating-linear-gradient(45deg, #1e3a8a, #1e3a8a 6px, #2563eb 6px, #2563eb 12px);
            border: 2px solid #f8fafc;
            border-radius: 9px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.45);
        }

        .center-cards {
            display: flex;
            align-items: center;
            gap: 24px;
            background: rgba(0, 0, 0, 0.28);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .pile-box {
            width: 76px;
            height: 106px;
            border: 2px dashed rgba(251, 191, 36, 0.5);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .count-badge { font-size: 11px; font-weight: 700; color: #fde68a; margin-top: 5px; text-align: center; }
        .status-msg {
            background: rgba(2, 6, 23, 0.88);
            color: #fbbf24;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(251, 191, 36, 0.5);
            text-align: center;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2,6,23,0.92); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .box { background: #1e293b; padding: 22px; border-radius: 16px; border: 2px solid #fbbf24; max-width: 360px; width: 100%; text-align: center; }
        .box h2 { color: #fbbf24; margin-bottom: 10px; font-size: 20px; }
        .lobby-list { background: #0f172a; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: left; font-size: 13px; line-height: 1.7; border: 1px solid #334155; }
        .btn { background: #fbbf24; color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 6px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 8px; }

        /* Mobil Ekranlar İçin Sıfır Taşmalı Dış Kenar Düzeni */
        @media screen and (max-width: 768px) {
            .top-bar { padding: 5px 8px; }
            .back-btn { padding: 4px 8px; font-size: 11px; }
            .scoreboard { gap: 4px; font-size: 10px; }
            .score-box { padding: 4px 6px; }
            .score-box span { font-size: 11px; }

            .table-grid {
                width: 99vw;
                max-width: 99vw;
                height: calc(100dvh - 44px);
                max-height: none;
                margin: 2px auto;
                grid-template-rows: 28px 1fr auto;
                grid-template-columns: 19% 62% 19%;
                padding: 4px 2px;
            }
            .table-grid::before {
                border-width: 5px;
                border-radius: 18px;
                height: calc(100% - 28px);
            }
            .seat-left { padding-right: 4px; }
            .seat-right { padding-left: 4px; }
            .seat-bottom { gap: 6px; }
            .player-tag { font-size: 9px; padding: 3px 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
            .player-hand { gap: 5px; min-height: 72px; }
            .card { width: 48px; height: 68px; font-size: 11px; padding: 3px; border-radius: 6px; }
            .card-center { font-size: 18px; }
            .card-back { width: 48px !important; height: 68px !important; border-radius: 6px; }
            .center-cards { gap: 10px; padding: 6px 10px; }
            .pile-box { width: 50px; height: 70px; }
            .count-badge { font-size: 9px; }
            .status-msg { font-size: 9px; padding: 4px 8px; max-width: 95%; }
        }
        /* Kart Dağılma ve Alan Oyuncuya Uçma Animasyonları */
        @keyframes dealCardAnim {
            0% { opacity: 0; transform: translateY(-90px) scale(0.4) rotate(-12deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }
        .card-deal-anim {
            animation: dealCardAnim 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }
        .flying-pile-card {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            transition: transform 0.85s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.85s ease-in;
        }
             
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="back-btn">← Salon</a>
        <div class="scoreboard">
            <div class="score-box" id="scoreLabel1">1. Taraf: <span id="t1Score">0</span></div>
            <div class="score-box" id="scoreLabel2">2. Taraf: <span id="t2Score">0</span></div>
            <div class="score-box" style="border-color:#fbbf24;">Hedef: <span id="targetDisplay">101</span></div>
        </div>
    </div>

    <div class="table-grid">
        <div class="seat-top">
            <div class="player-tag" id="tagTop">Üst Oyuncu</div>
            <div class="hand" id="handTop"></div>
        </div>

        <div class="seat-left" id="seatLeftBox">
            <div class="player-tag" id="tagLeft">Sol Rakip</div>
            <div class="side-hand" id="handLeft"></div>
        </div>

        <div class="center-table">
            <div class="center-cards">
                <div>
                    <div class="card-back" style="width:68px; height:98px;"></div>
                    <div class="count-badge" id="deckBadge">Deste: 44</div>
                </div>
                <div>
                    <div class="pile-box" id="pileBox"></div>
                    <div class="count-badge" id="pileBadge">Yerde: 4 Kart</div>
                </div>
            </div>
            <div class="status-msg" id="statusMsg">Masa seçimi bekleniyor...</div>
        </div>

        <div class="seat-right" id="seatRightBox">
            <div class="player-tag" id="tagRight">Sağ Rakip</div>
            <div class="side-hand" id="handRight"></div>
        </div>

        <div class="seat-bottom">
            <div class="player-tag" id="tagBottom">Siz</div>
            <div class="hand player-hand" id="handBottom"></div>
        </div>
    </div>

    <!-- Masa Seçim Lobisi -->
    <div class="overlay" id="lobbyOverlay">
        <div class="box">
            <h2>🃏 Canlı Pişti Salonu</h2>
            <div id="joinForm">
                <input type="text" id="playerNameInput" placeholder="Takma adınızı yazın..." maxlength="14">
                
                <div style="text-align:left; font-size:12px; color:#94a3b8; margin:8px 0 4px;">Oyun Modu Seçin:</div>
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <button type="button" class="btn" id="btnModeSolo" onclick="selectMode('solo')" style="margin:0; background:#334155; color:#fff;">👤 Tekli (2 Kişi)</button>
                    <button type="button" class="btn" id="btnModeTeam" onclick="selectMode('team')" style="margin:0;">👥 Eşli (4 Kişi)</button>
                </div>

                <div style="text-align:left; font-size:12px; color:#94a3b8; margin:8px 0 4px;">Bitiş Puanı Seçin:</div>
                <div style="display:flex; gap:8px; margin-bottom:14px;">
                    <button type="button" class="btn" id="btnTarget51" onclick="selectTarget(51)" style="margin:0; background:#334155; color:#fff;">51</button>
                    <button type="button" class="btn" id="btnTarget101" onclick="selectTarget(101)" style="margin:0;">101</button>
                    <button type="button" class="btn" id="btnTarget151" onclick="selectTarget(151)" style="margin:0; background:#334155; color:#fff;">151</button>
                </div>

                <button class="btn" onclick="joinTable()">Masaya Otur</button>
<button type="button" class="btn" onclick="joinTable(true)" style="background:#10b981; color:#fff;">+ Yeni Özel Masa Aç</button>
<div id="activeRoomsBox" style="margin-top:12px; text-align:left; max-height:130px; overflow-y:auto; background:#0f172a; padding:8px; border-radius:8px; border:1px solid #334155; font-size:12px;">
    <div style="color:#94a3b8; text-align:center;">Açık masalar yükleniyor...</div>
</div>
            </div>
            <div id="waitingArea" style="display:none;">
                <div class="lobby-list" id="lobbyPlayersList"></div>
                <button class="btn" onclick="socket.emit('fillPistiBots')">Botlarla Tamamla ve Başlat</button>
            </div>
        </div>
    </div>

    <!-- El Arası ve Maç Sonu Ekranı -->
    <div class="overlay" id="endOverlay" style="display:none;">
        <div class="box">
            <h2 id="endTitle">Tur Bitti!</h2>
            <p id="endDetail" style="margin:15px 0; line-height:1.7;"></p>
            <button class="btn" id="endBtn" onclick="location.reload()">Yeni Maç İçin Masaya Dön</button>
        </div>
    </div>
    <script>
        const socket = io();
        let selectedMode = 'team';
        let selectedTarget = 101;
        let mySeatIndex = 0;

        function selectMode(m) {
            selectedMode = m;
            document.getElementById('btnModeSolo').style.background = (m === 'solo') ? '#fbbf24' : '#334155';
            document.getElementById('btnModeSolo').style.color = (m === 'solo') ? '#0f172a' : '#fff';
            document.getElementById('btnModeTeam').style.background = (m === 'team') ? '#fbbf24' : '#334155';
            document.getElementById('btnModeTeam').style.color = (m === 'team') ? '#0f172a' : '#fff';
        }

                function selectTarget(t) {
            selectedTarget = t;
            Array.of(51, 101, 151).forEach(val => {
                const el = document.getElementById('btnTarget' + val);
                el.style.background = (val === t) ? '#fbbf24' : '#334155';
                el.style.color = (val === t) ? '#0f172a' : '#fff';
            });
        }

        function joinTable(forceNew = false, roomId = null) {
    const name = document.getElementById('playerNameInput').value.trim() || "Oyuncu";
    document.getElementById('joinForm').style.display = 'none';
    document.getElementById('waitingArea').style.display = 'block';
    socket.emit('joinPisti', { name: name, mode: selectedMode, target: selectedTarget, forceNew: forceNew, roomId: roomId });
}

socket.on('pistiRoomsList', (rooms) => {
    const box = document.getElementById('activeRoomsBox');
    if (!box) return;
    if (rooms.length === 0) {
        box.innerHTML = '<div style="color:#94a3b8; text-align:center;">Şu an bekleyen masa yok, yukarıdan hemen masa açabilirsiniz.</div>';
        return;
    }
    box.innerHTML = '<strong style="color:#fbbf24;">Açık Masalar:</strong><br>' + rooms.map(r => {
        const mText = r.mode === 'solo' ? 'Tekli' : 'Eşli';
        const btn = r.active ? '<span style="color:#ef4444;">Oyunda</span>' : `<button onclick="joinTable(false, '${r.id}')" style="background:#38bdf8; color:#0f172a; border:none; border-radius:4px; padding:2px 8px; font-weight:bold; cursor:pointer;">Katıl</button>`;
        return `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #1e293b;">
            <span>${r.title} (${mText} - ${r.target}p) [${r.count}/${r.max}]</span>
            ${btn}
        </div>`;
    }).join('');
});

        socket.on('pistiLobbyUpdate', (data) => {
            const modeText = data.mode === 'solo' ? 'Tekli (2 Kişi)' : 'Eşli (4 Kişi)';
            const list = document.getElementById('lobbyPlayersList');
            list.innerHTML = `<strong>${modeText} - ${data.target} Puan Masası (${data.players.length}/${data.maxPlayers}):</strong><br>` +
                data.players.map((p, i) => `${i + 1}. Koltuk: ${p.name}`).join('<br>');
        });

        socket.on('pistiBusy', (data) => {
            alert(data.message);
            location.reload();
        });

        function renderCard(card, clickable, idx) {
            const cls = card.isRed ? 'red' : 'black';
            const attr = clickable ? `onclick="playCard(${idx})"` : '';
            return `<div class="card ${cls}" ${attr}>
                <div>${card.value}${card.suit}</div>
                <div class="card-center">${card.suit}</div>
                <div style="text-align:right; transform:rotate(180deg);">${card.value}${card.suit}</div>
            </div>`;
        }

        function playCard(idx) {
            socket.emit('playPistiCard', { cardIndex: idx });
        }

        socket.on('pistiState', (state) => {
            document.getElementById('lobbyOverlay').style.display = 'none';
                        if (state.eventInfo && state.eventInfo.type === 'capture') {
                animateCaptureToPlayer(state.eventInfo.byIndex, state.myIndex, state.mode, state.eventInfo.card);
            }
            document.getElementById('endOverlay').style.display = 'none';
            mySeatIndex = state.myIndex;
            const isMyTurn = (state.turnIndex === mySeatIndex);

            document.getElementById('targetDisplay').innerText = state.target;
            document.getElementById('t1Score').innerText = state.totalScores.at(0);
            document.getElementById('t2Score').innerText = state.totalScores.at(1);
            document.getElementById('deckBadge').innerText = `Deste: ${state.deckCount}`;
            document.getElementById('pileBadge').innerText = `Yerde: ${state.pileCount} Kart`;
            document.getElementById('statusMsg').innerText = state.message;

            document.getElementById('pileBox').innerHTML = state.topCard ? renderCard(state.topCard, false, 0) : '';
            const isDeal = (state.eventInfo && state.eventInfo.type === 'deal');
document.getElementById('handBottom').innerHTML = state.myHand.map((c, i) => {
    let html = renderCard(c, isMyTurn, i);
    if (isDeal) {
        html = html.replace('class="card ', `style="animation-delay:${i * 0.12}s" class="card card-deal-anim `);
    }
    return html;
}).join('');

            const me = state.players[mySeatIndex];
            const tagBottom = document.getElementById('tagBottom');
            tagBottom.innerText = state.mode === 'solo' ? `${me.name}` : `${me.name} (Takım ${(mySeatIndex % 2) + 1})`;
            tagBottom.className = 'player-tag' + (state.turnIndex === mySeatIndex ? ' active-turn' : '');

                        if (state.mode === 'solo') {
                document.getElementById('seatLeftBox').style.visibility = 'hidden';
                document.getElementById('seatRightBox').style.visibility = 'hidden';
                document.getElementById('scoreLabel1').innerHTML = `${state.players.at(0).name}: <span id="t1Score">${state.totalScores.at(0)}</span>`;
                document.getElementById('scoreLabel2').innerHTML = `${state.players.at(1).name}: <span id="t2Score">${state.totalScores.at(1)}</span>`;

                const oppIdx = (mySeatIndex + 1) % 2;
                const opp = state.players[oppIdx];
                const tagTop = document.getElementById('tagTop');
                tagTop.innerText = `${opp.name} (${opp.cardCount})`;
                tagTop.className = 'player-tag' + (state.turnIndex === oppIdx ? ' active-turn' : '');
                document.getElementById('handTop').innerHTML = '';
            } else {
                document.getElementById('seatLeftBox').style.visibility = 'visible';
                document.getElementById('seatRightBox').style.visibility = 'visible';
                document.getElementById('scoreLabel1').innerHTML = `1. Takım (1-3): <span id="t1Score">${state.totalScores.at(0)}</span>`;
                document.getElementById('scoreLabel2').innerHTML = `2. Takım (2-4): <span id="t2Score">${state.totalScores.at(1)}</span>`;

                const seats = Array.of(
                    { idx: (mySeatIndex + 1) % 4, tag: 'tagRight', hand: 'handRight' },
                    { idx: (mySeatIndex + 2) % 4, tag: 'tagTop', hand: 'handTop' },
                    { idx: (mySeatIndex + 3) % 4, tag: 'tagLeft', hand: 'handLeft' }
                );
                seats.forEach(s => {
                    const pl = state.players[s.idx];
                    const tagEl = document.getElementById(s.tag);
                    tagEl.innerText = `${pl.name} (${pl.cardCount})`;
                    tagEl.className = 'player-tag' + (state.turnIndex === s.idx ? ' active-turn' : '');
                    document.getElementById(s.hand).innerHTML = '';
                });
            }
        });

        socket.on('pistiRoundSummary', (data) => {
            document.getElementById('endTitle').innerText = '📊 El Sonu Puan Durumu';
            document.getElementById('endDetail').innerHTML = `
                <strong>Bu El Alınan Puanlar:</strong> +${data.roundPts.at(0)} / +${data.roundPts.at(1)}<br>
                <strong>Toplam Skor:</strong> ${data.totalScores.at(0)} - ${data.totalScores.at(1)} (Hedef: ${data.target})<br>
                <small style="color:#fbbf24;">Yeni el 3 saniye içinde otomatik başlıyor...</small>
            `;
            document.getElementById('endBtn').style.display = 'none';
            document.getElementById('endOverlay').style.display = 'flex';
        });

        socket.on('pistiMatchOver', (res) => {
            const mySide = res.mode === 'solo' ? (mySeatIndex + 1) : ((mySeatIndex % 2) + 1);
            const iWon = (mySide === res.winnerSide);
            document.getElementById('endTitle').innerText = iWon ? '🏆 TEBRİKLER, MAÇI KAZANDINIZ!' : '🏁 Maç Sona Erdi!';
            document.getElementById('endDetail').innerHTML = `
                <strong>${res.target} Puan Hedefine Ulaşıldı!</strong><br><br>
                <strong>1. Taraf Toplam:</strong> ${res.totalScores.at(0)} Puan<br>
                <strong>2. Taraf Toplam:</strong> ${res.totalScores.at(1)} Puan
            `;
            document.getElementById('endBtn').style.display = 'block';
            document.getElementById('endOverlay').style.display = 'flex';
        });

        function animateCaptureToPlayer(winnerIdx, myIdx, mode, lastCard) {
    const pileEl = document.getElementById('pileBox');
    if (!pileEl) return;
    const rect = pileEl.getBoundingClientRect();

    let targetId = 'tagBottom';
    if (mode === 'solo') {
        targetId = (winnerIdx === myIdx) ? 'tagBottom' : 'tagTop';
    } else {
        const diff = (winnerIdx - myIdx + 4) % 4;
        if (diff === 1) targetId = 'tagRight';
        else if (diff === 2) targetId = 'tagTop';
        else if (diff === 3) targetId = 'tagLeft';
    }

    const targetEl = document.getElementById(targetId);
    if (!targetEl) return;
    const tRect = targetEl.getBoundingClientRect();

    const flyCard = document.createElement('div');
    flyCard.className = 'flying-pile-card';
    flyCard.style.left = rect.left + 'px';
    flyCard.style.top = rect.top + 'px';
    flyCard.innerHTML = lastCard ? renderCard(lastCard, false, 0) : '<div class="card-back"></div>';
    document.body.appendChild(flyCard);

    const dx = (tRect.left + tRect.width / 2) - (rect.left + rect.width / 2);
    const dy = (tRect.top + tRect.height / 2) - (rect.top + rect.height / 2);

    requestAnimationFrame(() => {
        flyCard.style.transform = `translate(${dx}px, ${dy}px) scale(0.35) rotate(18deg)`;
flyCard.style.opacity = '0';
});
setTimeout(() => { flyCard.remove(); }, 900);
}
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4 Kişilik Canlı Pişti - Online Oyun Salonu</title>
    <script src="/socket.io/socket.io.js"></script>
    <script async src="https://googlesyndication.com" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background: radial-gradient(circle, #065f46 0%, #022c22 100%); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .top-bar { background: rgba(15, 23, 42, 0.92); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fbbf24; }
        .back-btn { background: #334155; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .scoreboard { display: flex; gap: 10px; font-size: 13px; font-weight: bold; }
        .score-box { background: #1e293b; padding: 5px 10px; border-radius: 8px; border: 1px solid #475569; }
        .score-box span { color: #fbbf24; font-size: 15px; }
        .table-grid { flex: 1; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 90px 1fr 90px; max-width: 960px; width: 100%; margin: 0 auto; padding: 10px; align-items: center; }
        .seat-top { grid-column: 2; grid-row: 1; text-align: center; }
        .seat-left { grid-column: 1; grid-row: 2; text-align: center; }
        .seat-right { grid-column: 3; grid-row: 2; text-align: center; }
        .seat-bottom { grid-column: 2; grid-row: 3; text-align: center; }
        .center-table { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .player-tag { display: inline-block; background: rgba(15,23,42,0.8); padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 6px; border: 1px solid #475569; }
        .player-tag.active-turn { border-color: #fbbf24; color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .hand { display: flex; justify-content: center; gap: 8px; min-height: 96px; align-items: center; }
        .side-hand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .card { width: 68px; height: 98px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
        .player-hand .card:hover { transform: translateY(-10px); box-shadow: 0 8px 16px rgba(251,191,36,0.7); }
        .card.red { color: #dc2626; }
        .card.black { color: #0f172a; }
        .card-center { font-size: 26px; text-align: center; }
        .card-back { width: 46px; height: 66px; background: repeating-linear-gradient(45deg, #1e3a8a, #1e3a8a 6px, #1d4ed8 6px, #1d4ed8 12px); border: 2px solid #fff; border-radius: 6px; }
        .side-card-back { width: 54px; height: 22px; background: #1e3a8a; border: 2px solid #fff; border-radius: 4px; }
        .center-cards { display: flex; align-items: center; gap: 25px; }
        .pile-box { width: 76px; height: 104px; border: 2px dashed rgba(255,255,255,0.35); border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; }
        .count-badge { font-size: 11px; color: #fbbf24; margin-top: 4px; text-align: center; }
        .status-msg { background: rgba(15, 23, 42, 0.88); color: #fbbf24; padding: 7px 14px; border-radius: 18px; font-size: 13px; font-weight: bold; border: 1px solid #fbbf24; text-align: center; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2,6,23,0.9); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .box { background: #1e293b; padding: 24px; border-radius: 14px; border: 2px solid #fbbf24; max-width: 380px; width: 100%; text-align: center; }
        .box h2 { color: #fbbf24; margin-bottom: 12px; }
        .lobby-list { background: #0f172a; padding: 12px; border-radius: 8px; margin: 12px 0; text-align: left; font-size: 14px; line-height: 1.8; }
        .btn { background: #fbbf24; color: #0f172a; border: none; padding: 11px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="back-btn">← Salon</a>
        <div class="scoreboard">
            <div class="score-box">1-3 Takımı Pişti: <span id="t1Score">0</span></div>
            <div class="score-box">2-4 Takımı Pişti: <span id="t2Score">0</span></div>
        </div>
    </div>

    <div class="table-grid">
        <div class="seat-top">
            <div class="player-tag" id="tagTop">Ortak Bekleniyor</div>
            <div class="hand" id="handTop"></div>
        </div>

        <div class="seat-left">
            <div class="player-tag" id="tagLeft">Rakip 1</div>
            <div class="side-hand" id="handLeft"></div>
        </div>

        <div class="center-table">
            <div class="center-cards">
                <div>
                    <div class="card-back" style="width:68px; height:98px;"></div>
                    <div class="count-badge" id="deckBadge">Deste: 44</div>
                </div>
                <div>
                    <div class="pile-box" id="pileBox"></div>
                    <div class="count-badge" id="pileBadge">Yerde: 4 Kart</div>
                </div>
            </div>
            <div class="status-msg" id="statusMsg">Masaya bağlanılıyor...</div>
        </div>

        <div class="seat-right">
            <div class="player-tag" id="tagRight">Rakip 2</div>
            <div class="side-hand" id="handRight"></div>
        </div>

        <div class="seat-bottom">
            <div class="player-tag" id="tagBottom">Siz</div>
            <div class="hand player-hand" id="handBottom"></div>
        </div>
    </div>

    <div class="overlay" id="lobbyOverlay">
        <div class="box">
            <h2>🃏 4 Kişilik Pişti Masası</h2>
            <p style="font-size:13px; color:#cbd5e1;">4 gerçek oyuncu dolduğunda oyun otomatik başlar veya beklemek istemezseniz botlarla başlatabilirsiniz.</p>
            <div id="joinForm">
                <input type="text" id="playerNameInput" placeholder="Takma adınızı yazın..." maxlength="14">
                <button class="btn" onclick="joinTable()">Masaya Otur</button>
            </div>
            <div id="waitingArea" style="display:none;">
                <div class="lobby-list" id="lobbyPlayersList"></div>
                <button class="btn" onclick="socket.emit('fillPistiBots')">Botlarla Tamamla ve Başlat</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="endOverlay" style="display:none;">
        <div class="box">
            <h2 id="endTitle">El Tamamlandı!</h2>
            <p id="endDetail" style="margin:15px 0; line-height:1.7;"></p>
            <button class="btn" onclick="location.reload()">Yeni El İçin Masaya Dön</button>
        </div>
    </div>

    <script>
        const socket = io();
        let mySeatIndex = 0;

        function joinTable() {
            const name = document.getElementById('playerNameInput').value.trim() || "Oyuncu";
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('waitingArea').style.display = 'block';
            socket.emit('joinPisti', { name: name });
        }

        socket.on('pistiLobbyUpdate', (data) => {
            const list = document.getElementById('lobbyPlayersList');
            list.innerHTML = `<strong>Masadaki Oyuncular (${data.players.length}/4):</strong><br>` +
                data.players.map((p, i) => `${i + 1}. Koltuk: ${p.name}`).join('<br>');
        });

        socket.on('pistiBusy', (data) => {
            alert(data.message);
        });

        function renderCard(card, clickable, idx) {
            const cls = card.isRed ? 'red' : 'black';
            const attr = clickable ? `onclick="playCard(${idx})"` : '';
            return `<div class="card ${cls}" ${attr}>
                <div>${card.value}${card.suit}</div>
                <div class="card-center">${card.suit}</div>
                <div style="text-align:right; transform:rotate(180deg);">${card.value}${card.suit}</div>
            </div>`;
        }

        function playCard(idx) {
            socket.emit('playPistiCard', { cardIndex: idx });
        }

        socket.on('pistiState', (state) => {
            document.getElementById('lobbyOverlay').style.display = 'none';
            mySeatIndex = state.myIndex;
            const isMyTurn = (state.turnIndex === mySeatIndex);

            document.getElementById('t1Score').innerText = state.team1Score;
            document.getElementById('t2Score').innerText = state.team2Score;
            document.getElementById('deckBadge').innerText = `Deste: ${state.deckCount}`;
            document.getElementById('pileBadge').innerText = `Yerde: ${state.pileCount} Kart`;
            document.getElementById('statusMsg').innerText = state.message;

            const pileBox = document.getElementById('pileBox');
            pileBox.innerHTML = state.topCard ? renderCard(state.topCard, false, 0) : '';

            document.getElementById('handBottom').innerHTML = state.myHand.map((c, i) => renderCard(c, isMyTurn, i)).join('');

            const rightIdx = (mySeatIndex + 1) % 4;
            const topIdx = (mySeatIndex + 2) % 4;
            const leftIdx = (mySeatIndex + 3) % 4;

            const seats = [
                { idx: mySeatIndex, tag: 'tagBottom', hand: null },
                { idx: rightIdx, tag: 'tagRight', hand: 'handRight', side: true },
                { idx: topIdx, tag: 'tagTop', hand: 'handTop', side: false },
                { idx: leftIdx, tag: 'tagLeft', hand: 'handLeft', side: true }
            ];

            seats.forEach(s => {
                const pl = state.players[s.idx];
                const tagEl = document.getElementById(s.tag);
                tagEl.innerText = `${pl.name} (Takım ${(s.idx % 2) + 1})`;
                if (state.turnIndex === s.idx) tagEl.classList.add('active-turn');
                else tagEl.classList.remove('active-turn');

                if (s.hand) {
                    const cardHTML = s.side ? `<div class="side-card-back"></div>` : `<div class="card-back"></div>`;
                    document.getElementById(s.hand).innerHTML = Array(pl.cardCount).fill(cardHTML).join('');
                }
            });
        });

        socket.on('pistiGameOver', (res) => {
            const myTeam = (mySeatIndex % 2) + 1;
            const won = (myTeam === 1 && res.team1Score > res.team2Score) || (myTeam === 2 && res.team2Score > res.team1Score);
            document.getElementById('endTitle').innerText = won ? '🎉 Takımınız Kazandı!' : 'El Sona Erdi!';
            document.getElementById('endDetail').innerHTML = `
                <strong>1. Takım (1-3. Koltuklar):</strong> ${res.team1Score} Puan<br>
                <strong>2. Takım (2-4. Koltuklar):</strong> ${res.team2Score} Puan
            `;
            document.getElementById('endOverlay').style.display = 'flex';
        });
    </script>
</body>
</html>
